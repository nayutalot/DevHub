# nginx.conf —— DevHub ECS Relay 反代（部署实例化版；Caddyfile 二选一）
#
# 模板权威：docs/ecs-relay-deploy/nginx.conf.template；本文件仅将 {TLS_DIR} 实例化为
# /etc/devhub-relay/tls，其余零改动。装载：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/devhub-relay
#   sudo ln -sf /etc/nginx/sites-available/devhub-relay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP/1.1 上游池（WS 升级必须 HTTP/1.1；等价 Caddy 裸 http:// 上游 / docs/19 h12:// 语义）----
upstream devhub_relay_8443 {
    server 127.0.0.1:8443;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 59.110.149.11;

    # ---- 自签 IP 证书（SAN 必须含 IP:59.110.149.11 —— gen-ip-cert.sh 生成）----
    ssl_certificate     /etc/devhub-relay/tls/server.crt;
    ssl_certificate_key /etc/devhub-relay/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:devhub_relay_ssl:10m;

    # ---- WebSocket 透传（device leg /relay/device、host leg /relay/host）----
    location /relay/ {
        proxy_pass http://devhub_relay_8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # WS 长连：读超时要远大于应用层心跳周期（30s 心跳 + 余量）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- REST 面（docs/18 §7 五端点 + /v1/health）----
    location /v1/ {
        proxy_pass http://devhub_relay_8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 其余路径一律 404（不放大暴露面）
    location / {
        return 404;
    }

    # 凭据红线（约束 #13）：access_log 默认不含请求头，禁止追加 $http_authorization
    access_log /var/log/nginx/devhub-relay-access.log;
}
